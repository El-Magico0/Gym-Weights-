<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dr. Mostafa (Magico)</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: violet hero with the coach's name, then a home grid of muscle groups. Tapping a muscle opens a ruled table (exercise / reps / weight) that the client fills in by hand. English label on top, Arabic beneath. Midnight violet + gold. */
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --surface2:#EEEAF8; --fg:#1B1730; --muted:#645E80; --line:#DDD7EE; --grid:#BDB3DD;
  --accent:#B9740F; --accent-fg:#FFFFFF; --violet:#5B3FD0; --danger:#C0364A; --ok:#1F8F5C;
  --hero-a:#2B1C6E; --hero-b:#5B3FD0; --hero-fg:#FFFFFF; --gold:#F6C453; --shadow:rgba(40,25,110,.28);
  --display:'Barlow Condensed','Lalezar','Tajawal',Tahoma,sans-serif; --body:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100E1B; --surface:#1A1730; --surface2:#242042; --fg:#F1EEFB; --muted:#9A94BA; --line:#2E2A52; --grid:#4A4480;
  --accent:#F4B942; --accent-fg:#1A1200; --violet:#9B82F5; --danger:#FF6B7A; --ok:#3DD598;
  --hero-a:#1D1250; --hero-b:#3A26A0; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100E1B; --surface:#1A1730; --surface2:#242042; --fg:#F1EEFB; --muted:#9A94BA; --line:#2E2A52; --grid:#4A4480;
  --accent:#F4B942; --accent-fg:#1A1200; --violet:#9B82F5; --danger:#FF6B7A; --ok:#3DD598;
  --hero-a:#1D1250; --hero-b:#3A26A0; --shadow:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 2.5rem}
button,input,a,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:1rem}

/* hero */
.hero{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:1.25rem max(16px,env(safe-area-inset-right,0px)) 1.4rem max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 140% at 0% 0%,rgba(246,196,83,.22),transparent 55%),linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);margin-bottom:1rem;box-shadow:0 12px 28px -16px var(--shadow)}
.hero-in{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:1rem}
.brand{display:flex;align-items:center;gap:.9rem}
.logo{flex:none;width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#FFE29A,var(--gold));display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.eyebrow{margin:0;font-size:.8rem;letter-spacing:.06em;opacity:.8}
h1{margin:0;font-family:var(--display);font-weight:700;font-synthesis:none;font-size:clamp(2.3rem,10vw,3.3rem);line-height:1.05;letter-spacing:.01em;text-align:right}
h1 span{color:var(--gold)}
.who{display:grid;grid-template-columns:1fr auto;gap:.5rem .75rem;align-items:end}
.who label{grid-column:1/-1;font-size:.8rem;opacity:.85}
.who input{min-width:0;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;padding:0 .9rem}
.who input::placeholder{color:rgba(255,255,255,.6)}
#today{font-size:.9rem;opacity:.9;padding-bottom:.7rem;white-space:nowrap}

h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;text-wrap:balance}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.saved{margin:0;font-size:.85rem;color:var(--ok);font-weight:700}
.saved.bad{color:var(--danger)}
.warn{background:var(--danger);color:#fff;border-radius:14px;padding:.8rem 1rem;font-weight:700;font-size:.95rem}

/* home grid */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;padding:0;margin:0;list-style:none}
.g{display:flex;flex-direction:column;gap:.75rem;height:100%;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .6rem 1rem;position:relative;box-shadow:0 10px 22px -16px var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s}
.g:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 26px -14px var(--shadow)}
.ico{display:block;width:100%;aspect-ratio:1.2/1;border-radius:12px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.ico img{display:block;width:100%;height:100%;object-fit:contain}
.groups li:last-child:nth-child(odd) .g{flex-direction:row;align-items:center}
.groups li:last-child:nth-child(odd) .ico{width:50%;flex:none}
.groups li:last-child:nth-child(odd) .txt{flex:1}
.g .txt{min-width:0;display:flex;flex-direction:column;gap:.15rem;padding-inline:.4rem}
.g .en{font-family:var(--display);font-weight:700;font-synthesis:none;font-size:clamp(1.05rem,5vw,1.75rem);letter-spacing:.03em;white-space:nowrap;text-transform:uppercase;line-height:1}
.g .ar{color:var(--muted);font-weight:700;font-size:1rem;line-height:1.3}
.g .cnt{position:absolute;top:1rem;left:1rem;min-width:1.7rem;height:1.7rem;padding:0 .5rem;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:.85rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;z-index:1}

/* backup */
.bk{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.bk summary{display:flex;flex-direction:column;padding:.7rem 1rem;cursor:pointer;list-style:none;min-height:48px;justify-content:center}
.bk summary::-webkit-details-marker{display:none}
.bk summary b{font-family:var(--display);font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.bk summary span{color:var(--muted);font-size:.9rem;font-weight:700}
.bk-b{display:flex;flex-direction:column;gap:.7rem;padding:0 1rem 1rem}
.bk textarea{width:100%;min-height:6rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:.6rem;font-size:.9rem}

/* table view */
.top{display:flex;align-items:center;gap:.75rem}
.back{flex:none;height:44px;display:inline-flex;align-items:center;gap:.4rem;padding:0 1rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:700}
.title{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.title h2{font-weight:700;font-synthesis:none;font-size:2.1rem;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.title small{color:var(--muted);font-weight:700;font-size:1rem;line-height:1.2}
.tbl-box{border:2px solid var(--grid);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:0 14px 28px -20px var(--shadow)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid var(--grid);padding:0}
tr>*:first-child{border-inline-start:0}
tr>*:last-child{border-inline-end:0}
thead th{background:linear-gradient(180deg,var(--violet),var(--hero-b));color:#fff;border-color:rgba(255,255,255,.25);padding:.55rem .3rem .6rem;text-align:center;line-height:1.2}
thead th .en{display:block;font-family:var(--display);font-weight:700;font-synthesis:none;font-size:1.2rem;letter-spacing:.07em;text-transform:uppercase}
thead th .ar{display:block;font-size:.85rem;font-weight:500;opacity:.9;margin-top:.1rem}
tbody tr:first-child td{border-top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 45%,transparent)}
td input{display:block;width:100%;height:52px;border:0;background:transparent;padding:0 .6rem;font-size:1.05rem;border-radius:0}
td input:focus{outline:none;background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
td.num input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
td.del{text-align:center}
.x{width:100%;height:52px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1}
.x:hover{color:var(--danger)}
.x.armed{background:var(--danger);color:#fff;font-weight:800}
.tbl-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem}
.bigbtn{height:50px;border-radius:14px;border:0;font-weight:800;font-size:1rem;padding:0 1.1rem}
.bigbtn.gold{background:var(--accent);color:var(--accent-fg)}
.bigbtn.line{background:var(--surface);border:1px solid var(--line)}
.bigbtn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
#cp{width:100%;min-height:9rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:.7rem;font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + .8rem);background:var(--fg);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
.groups li:last-child:nth-child(odd){grid-column:1/-1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="hero">
    <div class="hero-in">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="#2B1C6E"><path d="M12 2l2.2 6.3L21 10l-5.6 3.8L17 21l-5-4-5 4 1.6-7.2L3 10l6.8-1.7z"/></svg>
        </div>
        <div>
          <p class="eyebrow">سجل التمارين والأوزان</p>
          <h1 dir="ltr">Dr. Mostafa <span>(Magico)</span></h1>
        </div>
      </div>
      <div class="who">
        <label for="client">اسم اللاعب</label>
        <input id="client" placeholder="اكتب اسمك هنا" autocomplete="name">
        <span id="today"></span>
      </div>
    </div>
  </header>

  <div class="wrap" id="warnbox" hidden style="margin-bottom:1rem"><div class="warn">المتصفح ده مش بيحفظ البيانات (غالباً نافذة خاصة أو إعدادات بتمنع التخزين). افتح الرابط في متصفح عادي، أو استخدم «النسخة الاحتياطية» عشان بياناتك ما تضيعش.</div></div>
  <main class="wrap" id="view"></main>
</div>

  function icon(id){var wide=id==='chest'||id==='back'||id==='shoulders';return '<span class="ico"><img src="'+IMG[id]+'" alt="" width="360" height="300" decoding="async" style="object-fit:'+(wide?'cover':'contain')+'"></span>'}

  var GROUPS=[
    {id:'chest',ar:'الصدر',en:'Chest'},
    {id:'back',ar:'الظهر',en:'Back'},
    {id:'biceps',ar:'الباي',en:'Biceps'},
    {id:'triceps',ar:'الترايسبس',en:'Triceps'},
    {id:'shoulders',ar:'الأكتاف',en:'Shoulders'},
    {id:'legs',ar:'الرجل',en:'Legs'},
    {id:'abs',ar:'البطن',en:'Abs'}
  ];
  var ROWS=8;
  function blank(n){var a=[];for(var i=0;i<n;i++)a.push({ex:'',reps:'',w:''});return a}
  function group(id){return GROUPS.find(function(g){return g.id===id})}

  /* ---------- storage: localStorage + IndexedDB, both written on every change ---------- */
  var hasLS=false,hasIDB=false,idb=null,pt=null,dirty=false,lastSaved=null,askedPersist=false;
  function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function lsSet(v){try{localStorage.setItem(KEY,v);hasLS=true;return true}catch(e){hasLS=false;return false}}
  function idbOpen(cb){
    try{
      var r=indexedDB.open(IDB_NAME,1);
      r.onupgradeneeded=function(){try{r.result.createObjectStore(IDB_STORE)}catch(e){}};
      r.onsuccess=function(){idb=r.result;hasIDB=true;cb()};
      r.onerror=function(){cb()};
      r.onblocked=function(){cb()};
    }catch(e){cb()}
  }
  function idbGet(cb){
    if(!idb)return cb(null);
    try{var q=idb.transaction(IDB_STORE).objectStore(IDB_STORE).get(KEY);q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}}catch(e){cb(null)}
  }
  function idbSet(v){if(!idb)return;try{idb.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,KEY)}catch(e){}}
  function norm(s){
    if(!s||typeof s!=='object')return null;
    var o={client:typeof s.client==='string'?s.client:'',t:{},ts:+s.ts||0};
    var t=(s.t&&typeof s.t==='object')?s.t:{};
    GROUPS.forEach(function(g){
      var rows=Array.isArray(t[g.id])?t[g.id].map(function(r){r=r||{};return{ex:String(r.ex==null?'':r.ex),reps:String(r.reps==null?'':r.reps),w:String(r.w==null?'':r.w)}}):[];
      o.t[g.id]=rows.length?rows:blank(ROWS);
    });
    return o;
  }
  function parse(str){try{return norm(JSON.parse(str))}catch(e){return null}}
  var S=parse(lsGet())||norm({});
  hasLS=(function(){try{localStorage.setItem('__magico_probe','1');localStorage.removeItem('__magico_probe');return true}catch(e){return false}})();
  function filled(id){return S.t[id].filter(function(r){return r.ex.trim()||r.reps.trim()||r.w.trim()}).length}

  function showSaved(){
    var el=$('#saved');if(!el)return;
    if(!hasLS&&!hasIDB){el.textContent='لا بيتحفظ: المتصفح بيمنع التخزين';el.className='saved bad';return}
    el.className='saved';
    el.textContent=lastSaved?'تم الحفظ تلقائياً '+lastSaved.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'كل اللي بتكتبه بيتحفظ تلقائياً على جهازك';
  }
  function persist(){
    dirty=true;S.ts=Date.now();
    var v=JSON.stringify(S);
    lsSet(v);
    clearTimeout(pt);pt=setTimeout(function(){idbSet(v)},250);
    lastSaved=new Date();showSaved();
    if(!askedPersist){askedPersist=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
    $('#warnbox').hidden=(hasLS||hasIDB);
  }
  function flush(){if(!dirty)return;var v=JSON.stringify(S);lsSet(v);idbSet(v)}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
  window.addEventListener('pagehide',flush);

  var tt;
  function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2400)}
  function armed(btn,label){
    if(btn.dataset.armed)return true;
    btn.dataset.armed='1';btn.dataset.label=btn.textContent;btn.textContent=label||'اضغط للتأكيد';btn.classList.add('armed');
    setTimeout(function(){if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label;btn.classList.remove('armed')}},3000);
    return false;
  }

  /* ---------- views ---------- */
  function home(){
    $('#view').innerHTML=
      '<div><h2>اختار العضلة</h2><p class="hint">دوس على العضلة اللي بتتمرنها، واكتب تمارينك وعداتك وأوزانك في الجدول. كل حاجة بتكتبها بتفضل محفوظة، وتلاقيها لما ترجع.</p></div>'+
      '<p class="saved" id="saved"></p>'+
      '<ul class="groups">'+GROUPS.map(function(g){
        var n=filled(g.id);
        return '<li><a class="g" href="#'+g.id+'" aria-label="'+g.en+' - '+g.ar+'">'+
          (n?'<span class="cnt" title="صفوف مكتوبة">'+n+'</span>':'')+
          icon(g.id)+
          '<span class="txt"><span class="en">'+g.en+'</span><span class="ar">'+g.ar+'</span></span></a></li>';
      }).join('')+'</ul>'+
      '<div class="tbl-actions"><button class="bigbtn line" data-act="copyall">نسخ كل تمارين الكوتش</button></div>'+
      '<textarea id="cp" readonly hidden aria-label="الملخص"></textarea>'+
      '<details class="bk"><summary><b>Backup</b><span>نسخة احتياطية لبياناتك</span></summary><div class="bk-b">'+
      '<p class="hint">لو غيّرت التليفون أو مسحت بيانات المتصفح، انسخ النسخة الاحتياطية واحفظها عندك (مثلاً رسالة لنفسك على واتساب). بعدها الصقها هنا واضغط استرجاع.</p>'+
      '<button class="bigbtn gold" data-act="bkcopy">نسخ نسخة احتياطية</button>'+
      '<textarea id="bkbox" placeholder="الصق النسخة الاحتياطية هنا" aria-label="النسخة الاحتياطية"></textarea>'+
      '<button class="bigbtn line" data-act="bkrestore">استرجاع البيانات</button></div></details>';
    showSaved();
  }
  function rowHtml(r,i){
    return '<tr data-i="'+i+'">'+
      '<td><input data-f="ex" dir="auto" value="'+esc(r.ex)+'" autocomplete="off" autocapitalize="words" aria-label="Exercise، صف '+(i+1)+'"></td>'+
      '<td class="num"><input data-f="reps" dir="ltr" value="'+esc(r.reps)+'" autocomplete="off" aria-label="Reps، صف '+(i+1)+'"></td>'+
      '<td class="num"><input data-f="w" dir="ltr" value="'+esc(r.w)+'" autocomplete="off" aria-label="Weight، صف '+(i+1)+'"></td>'+
      '<td class="del"><button class="x" data-act="delrow" aria-label="حذف الصف '+(i+1)+'">×</button></td></tr>';
  }
  function tableView(id){
    var g=group(id);
    $('#view').innerHTML=
      '<div class="top"><a class="back" href="#home">&rarr; الرجوع</a>'+
      '<div class="title"><h2>'+g.en+'</h2><small>'+g.ar+'</small></div></div>'+
      '<p class="saved" id="saved"></p>'+
      '<div class="tbl-box"><table><colgroup><col style="width:44%"><col style="width:25%"><col style="width:25%"><col style="width:6%;min-width:44px"></colgroup>'+
      '<thead><tr>'+
      '<th scope="col"><span class="en" dir="ltr">Exercise</span><span class="ar">اسم التمرين</span></th>'+
      '<th scope="col"><span class="en" dir="ltr">Reps</span><span class="ar">العدات</span></th>'+
      '<th scope="col"><span class="en" dir="ltr">Weight (kg)</span><span class="ar">الأوزان</span></th>'+
      '<th scope="col"><span style="position:absolute;left:-9999px">حذف</span></th></tr></thead>'+
      '<tbody id="tb">'+S.t[id].map(rowHtml).join('')+'</tbody></table></div>'+
      '<div class="tbl-actions"><button class="bigbtn gold" data-act="addrow">+ إضافة صف</button>'+
      '<button class="bigbtn line" data-act="copy">نسخ للكوتش</button>'+
      '<button class="bigbtn line" data-act="clear">مسح الجدول</button></div>'+
      '<textarea id="cp" readonly hidden aria-label="الملخص"></textarea>';
    showSaved();
  }
  var cur='';
  function route(){
    var h=location.hash.replace('#','');
    cur=group(h)?h:'';
    if(cur)tableView(cur);else home();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);

  function lines(id){
    var g=group(id),rows=S.t[id].filter(function(r){return r.ex.trim()||r.reps.trim()||r.w.trim()});
    if(!rows.length)return '';
    return g.en+' - '+g.ar+'\n'+rows.map(function(r){return '- '+(r.ex.trim()||'—')+' | Reps: '+(r.reps.trim()||'—')+' | Weight: '+(r.w.trim()||'—')}).join('\n');
  }
  function head(){return 'Dr. Mostafa (Magico)\nالاسم: '+(S.client||'—')+' | '+new Date().toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long'})+'\n'}
  function copy(txt,okMsg){
    var ta=$('#cp');
    var fallback=function(){ta.value=txt;ta.hidden=false;ta.focus();ta.select();toast('انسخ النص من الخانة')};
    try{navigator.clipboard.writeText(txt).then(function(){ta.hidden=true;toast(okMsg||'تم النسخ، ابعته للكوتش')},fallback)}catch(e){fallback()}
  }

  /* ---------- events ---------- */
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='client'){S.client=t.value;persist();return}
    var f=t.dataset.f,tr=t.closest('tr[data-i]');
    if(!f||!tr||!cur)return;
    S.t[cur][+tr.dataset.i][f]=t.value;persist();
  });
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var a=b.dataset.act;
    if(a==='addrow'){S.t[cur].push({ex:'',reps:'',w:''});persist();tableView(cur);var ins=document.querySelectorAll('#tb tr:last-child input');if(ins[0])ins[0].focus()}
    else if(a==='delrow'){
      if(!armed(b,'✓'))return;
      var i=+b.closest('tr').dataset.i;
      S.t[cur].splice(i,1);if(!S.t[cur].length)S.t[cur]=blank(1);
      persist();tableView(cur);
    }
    else if(a==='clear'){if(!armed(b))return;S.t[cur]=blank(ROWS);persist();tableView(cur);toast('تم مسح الجدول')}
    else if(a==='copy'){var l=lines(cur);if(!l){toast('الجدول فاضي');return}copy(head()+'\n'+l)}
    else if(a==='copyall'){
      var all=GROUPS.map(function(g){return lines(g.id)}).filter(Boolean);
      if(!all.length){toast('لسه ما كتبتش حاجة');return}
      copy(head()+'\n'+all.join('\n\n'));
    }
    else if(a==='bkcopy'){copy('MAGICO1:'+JSON.stringify({client:S.client,t:S.t}),'تم نسخ النسخة الاحتياطية. احفظها في مكان آمن')}
    else if(a==='bkrestore'){
      var box=$('#bkbox'),txt=(box.value||'').trim();
      if(txt.indexOf('MAGICO1:')!==0){toast('النسخة مش صحيحة');return}
      var o=parse(txt.slice(8));
      if(!o){toast('النسخة مش صحيحة');return}
      if(!armed(b,'اضغط للتأكيد، هيتبدل اللي موجود'))return;
      S=o;persist();$('#client').value=S.client;route();toast('تم استرجاع بياناتك');
    }
  });

  /* ---------- start ---------- */
  $('#client').value=S.client;
  $('#today').textContent=new Date().toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  route();
  idbOpen(function(){
    idbGet(function(raw){
      var o=raw?parse(raw):null;
      var lsHad=lsGet()!==null;
      if(o&&!dirty&&(!lsHad||o.ts>S.ts)){S=o;lsSet(JSON.stringify(S));$('#client').value=S.client;route()}
      else if(lsHad&&hasIDB&&(!o||o.ts<S.ts)&&S.ts)idbSet(JSON.stringify(S));
      hasLS=hasLS||lsGet()!==null;
      $('#warnbox').hidden=(hasLS||hasIDB);
      showSaved();
    });
  });
})();
</script>

</body></html>
